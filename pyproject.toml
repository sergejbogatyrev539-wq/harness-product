[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-harness"
version = "0.1.0a0"
description = "Non-effectful reference kernel for a fail-closed harness"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.18.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
